name: console2discord
version: '${project.version}'

main: io.itch.aktomik.console2Discord.Console2Discord
api-version: '1.13'
folia-supported: true
load: STARTUP

description: 'Forward your console logs to Discord using webhooks.'
author: 'AKtomik'
website: 'https://github.com/AKtomik/console2discord'

commands:
  console2discord:
    description: Manage Console2Discord plugin
    usage: /<command> [help|webhook|status|reload|stop|start]
    aliases: [c2d]
    permission: console2discord.command

permissions:
  console2discord.command:
    description: Permission to use Console2Discord command
    default: op
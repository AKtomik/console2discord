name: console2discord
version: '${version}'

main: io.itch.aktomik.console2Discord.Console2Discord
api-version: '1.13'
load: STARTUP

commands:
  console2discord:
    description: Manage Console2Discord plugin
    usage: /<command> [help | status | reload | start | stop | pause]
    aliases: [c2d]
    permission: console2discord.command

permissions:
  console2discord.command:
    description: Permission to use Console2Discord command
    default: op
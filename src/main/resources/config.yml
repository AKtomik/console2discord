
# --------------------------------------------------- put your discord webhook here --------------------------------------------------
webhook-url: YOUR_URL_HERE
# ------------------------------------------------------------------------------------------------------------------------------------

message:
  # [INFO] text sent before starting
  welcome-text: 'Hello!'

  # [INFO] text sent after shutdown
  goodbye-text: 'Bye!'

  # [INFO] text added to truncated element
  truncation-text: '...'

content:
  # [INFO] max number of characters for content body of a message
  # [WARN] discord limit is 2000 by message, and a margin is needed for formating
  body-char-limit: 1900

  # [INFO] change how is formated log on sending
  # [USE] you can use: CODEBLOCK, ANSIBLOCK, INLINE, TEXT
  format: 'ANSIBLOCK'

  # [ERROR] options working only if format is ANSI-BLOCK
  ansi:
    # [INFO] convert detected legacy color (using §) to ansi
    convert-legacy: true

    # [INFO] do apply a yellow color to warnings logs
    color-warning: true

    # [INFO] do apply a red color to errors logs
    color-error: true


  stack-trace:
    # [INFO] if stack trace is forwarded to discord
    allow: true

    # [INFO] max number of characters for a stack trace before truncating it
    char-limit: 1200

    # [INFO] if keeping the first cause line is a priority in truncation
    prioritize-first-cause: true

filter:
  # [INFO] only send logs of a certain level
  # [USE] accepted levels: FATAL, ERROR, WARN, INFO (keep empty for no filter)
  allowed-levels:
    #- 'FATAL'
    #- 'ERROR'
    #- 'WARN'
    #- 'INFO'

queue:
  # [INFO] how much logs can be stored in the queue
  # [WARN] if the capacity is full, new messages are ignored
  # [WARN] if the capacity is too big, it is not flood proof
  wait-capacity: 300

  # [INFO] group messages if sent the same second
  group-by-second: true

  # [INFO] how much try to send a request before skip
  request-try-amount: 5

  # [INFO] various delay times to not reach discord rate limits
  # [ERROR] do not change unless you know what you are doing!
  wait-time:
    breath-start-ms: 100
    between-request-min-ms: 100
    between-request-max-ms: 400
    retry-delay-first-ms: 500
    retry-delay-increment-ms: 1000
    shutdown-worker-margin-ms: 15000

debug:
  # [INFO] will test by sending to console after enable
  # [WARN] this will produce errors/warnings in console
  test-warning: false
  test-error: false
  test-crash: false

  # [WARN] this used for config update messages
  generated-version: ${version}